<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panic Button Cluster</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

</head>
<body style="font-family: Arial, sans-serif; text-align: center; padding: 40px;">

  <h1>🚨</h1>
  <h1>Panic Button</h1>
  <p>Aplikasi Gawat Darurat Bagi Warga Cluster Kristal Aryana</p>

  <button style="
    font-size: 24px;
    padding: 20px 40px;
    background: red;
    color: white;
    border: none;
    border-radius: 10px;
  ">
    PANIC!
  </button>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js');
    }
  </script>

</body>
</html>
