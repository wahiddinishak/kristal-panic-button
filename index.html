<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kristal Panic Button</title>
  <link rel="manifest" href="manifest.json">
</head>

<body style="font-family: Arial, sans-serif; padding: 24px; max-width: 480px; margin: auto;">

  <h2>🚨 Kristal Panic Button</h2>

  <!-- FORM IDENTITAS -->
  <div id="form-identitas">
    <p><strong>Pengisian Identitas Diperlukan dan Hanya Sekali Isi Saja.</strong></p>

    <label>Nama Warga</label><br>
    <input id="nama" type="text" style="width:100%; padding:8px;"><br><br>

    <label>No Rumah (Contoh: L4-10)</label><br>
    <input id="rumah" type="text" style="width:100%; padding:8px;"><br><br>

    <button onclick="simpanIdentitas()" style="padding:10px 20px;">
      Simpan
    </button>
  </div>

  <!-- PANIC BUTTON -->
  <div id="panic-area" style="display:none; text-align:center; margin-top:40px;">
    <p><strong>Tekan tombol PANIC! saat DARURAT</strong></p>

    <button onclick="panic()"
      style="
        font-size: 22px;
        padding: 24px 40px;
        background: red;
        color: white;
        border: none;
        border-radius: 12px;
      ">
      PANIC!
    </button>

    <br><br>
    <button onclick="resetIdentitas()" style="font-size:12px;">
      Ubah Identitas
    </button>
  </div>

  <script>
    const nama = localStorage.getItem('nama');
    const rumah = localStorage.getItem('rumah');

    if (nama && rumah) {
      document.getElementById('form-identitas').style.display = 'none';
      document.getElementById('panic-area').style.display = 'block';
    }

    function simpanIdentitas() {
      const namaInput = document.getElementById('nama').value;
      const rumahInput = document.getElementById('rumah').value;

      if (!namaInput || !rumahInput) {
        alert('Lengkapi identitas');
        return;
      }

      localStorage.setItem('nama', namaInput);
      localStorage.setItem('rumah', rumahInput);

      location.reload();
    }

    function resetIdentitas() {
      if (confirm('Ubah identitas warga?')) {
        localStorage.clear();
        location.reload();
      }
    }

    function panic() {

        if (!confirm('Gunakan panic button hanya saat DARURAT. Lanjutkan?')) {
          return;
        }

        const nama = localStorage.getItem('nama');
    const rumah = localStorage.getItem('rumah');

    if (!navigator.geolocation) {
      alert('GPS tidak tersedia');
      return;
    }

    navigator.geolocation.getCurrentPosition(
      position => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        const waktu = new Date().toLocaleString('id-ID');

        const pesan =
`🚨 DARURAT 🚨

Nama   : ${nama}
Rumah  : ${rumah}
Waktu  : ${waktu}
Lokasi : https://maps.google.com/?q=${lat},${lon}

Mohon bantuan segera!`;

        const nomorSecurity = '6282122904511';

        const url = `https://wa.me/${nomorSecurity}?text=${encodeURIComponent(pesan)}`;

        window.location.href = url;
      },
      error => {
        alert('Gagal mendapatkan lokasi. Aktifkan GPS.');
      },
      {
        enableHighAccuracy: true,
        timeout: 10000
      }
    );
  }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js');
    }
  </script>

</body>
</html>
